logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

# This rebuild owns its MySQL instance on host port 3307.
db_meta:
  host: ${oc.env:META_MYSQL_HOST,localhost}
  port: ${oc.env:META_MYSQL_PORT,3307}
  user: shopkeeper
  password: ${oc.env:MYSQL_PASSWORD}
  database: meta

db_dw:
  host: ${oc.env:DW_MYSQL_HOST,localhost}
  port: ${oc.env:DW_MYSQL_PORT,3307}
  user: shopkeeper
  password: ${oc.env:MYSQL_PASSWORD}
  database: dw

# This rebuild owns its Qdrant instance on alternate host ports.
qdrant:
  host: ${oc.env:QDRANT_HOST,localhost}
  port: ${oc.env:QDRANT_PORT,6335}
  embedding_size: 1024
  column_collection_name: column_info_collection_rebuild
  metric_collection_name: metric_info_collection_rebuild

# The existing Embedding container has a broken model mount, so the rebuild
# owns a healthy TEI instance on host port 8082.
embedding:
  host: ${oc.env:EMBEDDING_HOST,localhost}
  port: ${oc.env:EMBEDDING_PORT,8082}
  model: BAAI/bge-large-zh-v1.5

# This rebuild owns its Elasticsearch instance on an alternate host port.
es:
  host: ${oc.env:ELASTICSEARCH_HOST,localhost}
  port: ${oc.env:ELASTICSEARCH_PORT,9201}
  index_name: value_index_rebuild

llm:
  model_name: deepseek-v4-pro
  api_key: ${oc.env:LLM_API_KEY}
  base_url: https://api.deepseek.com
  timeout_seconds: 60
  max_retries: 1

# 在线请求的生产保护边界。总超时覆盖整条 LangGraph；检索超时只约束
# 单次 Embedding/Qdrant/Elasticsearch 操作；健康检查不会调用付费 LLM。
runtime:
  query_timeout_seconds: 120
  retrieval_timeout_seconds: 20
  health_timeout_seconds: 5
  max_concurrent_queries: 4

api:
  # 仅允许本地 Vite 前端跨域访问。开启 credentials 时不能使用通配符 *。
  cors_allowed_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
