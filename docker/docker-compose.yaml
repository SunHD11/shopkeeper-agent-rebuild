name: shopkeeper-agent-rebuild

services:
  mysql:
    image: mysql:8.0
    container_name: shopkeeper-rebuild-mysql
    restart: unless-stopped
    mem_limit: 768m
    env_file:
      - ../.env
    environment:
      MYSQL_DATABASE: meta
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.16
    container_name: shopkeeper-rebuild-qdrant
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "${QDRANT_HTTP_HOST_PORT:-6335}:6333"
      - "${QDRANT_GRPC_HOST_PORT:-6336}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  elasticsearch:
    build:
      context: ./elasticsearch
    container_name: shopkeeper-rebuild-elasticsearch
    restart: unless-stopped
    mem_limit: 1280m
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_HOST_PORT:-9201}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  kibana:
    image: kibana:8.19.10
    container_name: shopkeeper-rebuild-kibana
    restart: unless-stopped
    mem_limit: 1280m
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      NODE_OPTIONS: --max-old-space-size=768
    ports:
      - "${KIBANA_HOST_PORT:-5602}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    platform: linux/amd64
    container_name: shopkeeper-rebuild-embedding
    restart: unless-stopped
    ports:
      - "${EMBEDDING_HOST_PORT:-8082}:80"
    shm_size: 1gb
    command:
      - --model-id
      - ${EMBEDDING_MODEL:-BAAI/bge-large-zh-v1.5}
      - --max-concurrent-requests
      - "16"
      - --max-batch-tokens
      - "16384"
    volumes:
      # 首次启动从 Hugging Face 下载，后续启动复用命名卷中的模型缓存。
      - embedding_data:/data

  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    container_name: shopkeeper-rebuild-api
    restart: unless-stopped
    init: true
    mem_limit: 1g
    env_file:
      - ../.env
    environment:
      META_MYSQL_HOST: mysql
      META_MYSQL_PORT: "3306"
      DW_MYSQL_HOST: mysql
      DW_MYSQL_PORT: "3306"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: "9200"
      EMBEDDING_HOST: embedding
      EMBEDDING_PORT: "80"
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - api_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      qdrant:
        condition: service_started
      embedding:
        condition: service_started
    healthcheck:
      # readiness 会同时验证两套 MySQL、Qdrant、ES 和真实 Embedding 向量请求。
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=8)
      interval: 10s
      timeout: 10s
      retries: 120
      start_period: 30s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: shopkeeper-rebuild-frontend
    restart: unless-stopped
    init: true
    mem_limit: 256m
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
  es_data:
  qdrant_data:
  embedding_data:
  api_logs:
