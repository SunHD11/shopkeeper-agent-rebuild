name: shopkeeper-agent-rebuild

services:
  mysql:
    image: mysql:8.0
    container_name: shopkeeper-rebuild-mysql
    restart: unless-stopped
    mem_limit: 768m
    env_file:
      - ../.env
    environment:
      MYSQL_DATABASE: meta
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.16
    container_name: shopkeeper-rebuild-qdrant
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "${QDRANT_HTTP_HOST_PORT:-6335}:6333"
      - "${QDRANT_GRPC_HOST_PORT:-6336}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  elasticsearch:
    build:
      context: ./elasticsearch
    container_name: shopkeeper-rebuild-elasticsearch
    restart: unless-stopped
    mem_limit: 1280m
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_HOST_PORT:-9201}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  kibana:
    image: kibana:8.19.10
    container_name: shopkeeper-rebuild-kibana
    restart: unless-stopped
    mem_limit: 1280m
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      NODE_OPTIONS: --max-old-space-size=768
    ports:
      - "${KIBANA_HOST_PORT:-5602}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    platform: linux/amd64
    container_name: shopkeeper-rebuild-embedding
    restart: unless-stopped
    ports:
      - "${EMBEDDING_HOST_PORT:-8082}:80"
    environment:
      MODEL_ID: /models/bge-large-zh-v1.5
      MAX_CONCURRENT_REQUESTS: "16"
      MAX_BATCH_TOKENS: "16384"
    volumes:
      - ./embedding/bge-large-zh-v1.5:/models/bge-large-zh-v1.5:ro

volumes:
  mysql_data:
  es_data:
  qdrant_data:
