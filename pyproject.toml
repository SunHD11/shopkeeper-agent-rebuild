[project]
name = "shopkeeper-agent-rebuild"
version = "0.1.0"
description = "A from-scratch rebuild of the Shopkeeper data-analysis agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "asyncmy>=0.2.11",
  "cryptography>=46.0.7",
  "elasticsearch[async]>=8,<9",
  "fastapi[standard]>=0.135.3",
  "greenlet>=3.4.0",
  "huggingface-hub>=1.10.1",
  "jieba>=0.42.1",
  "langchain>=1.2.15",
  "langchain-deepseek>=1.0.1",
  "langchain-huggingface>=1.2.1",
  "langgraph>=1.1.6",
  "loguru>=0.7.3",
  "omegaconf>=2.3.0",
  "python-dotenv>=1.2.2",
  "pyyaml>=6.0.3",
  "qdrant-client>=1.16,<1.18",
  "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
  "pre-commit>=4.3.0",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.25.3",
  "ruff>=0.11.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: requires the local Docker services",
]
